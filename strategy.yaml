dry_run: true
min_edge: 0.05
min_prob: 0.87
min_bet: 1.00
max_bet: 50.00
bankroll: 100.00
kelly_fraction_cap: 0.05
auto_update_enabled: false

# Safety: must be true in .env to allow live trading
live_trading_ack: false

# Proxy wallet / Gnosis Safe support
# Set SAFE_ADDRESS in .env for proxy wallet, or set signature_type here
# 1 = EOA (default), 2 = POLY_PROXY, 3 = POLY_GNOSIS_SAFE
signature_type: 1

# Future phases (scaffolded, not yet implemented)
markov_window: 20
journal_path: "logs/trade_journal"

# Telegram (secrets go in .env, not here)
# telegram_bot_token and telegram_chat_id are read from .env
telegram_enabled: true
telegram_trade_alerts: true
telegram_skip_alerts: false
telegram_bot_lifecycle_alerts: true
telegram_error_alerts: true
telegram_daily_summary: true

# Nightly review
nightly_review_enabled: true
nightly_review_time: "00:00"

# Strategy auto-update safety bounds
min_prob_min: 0.82
min_prob_max: 0.95
min_prob_daily_step: 0.02
kelly_fraction_cap_min: 0.01
kelly_fraction_cap_max: 0.10
kelly_fraction_cap_daily_step: 0.01

# Watchdog
watchdog_enabled: true
watchdog_stale_minutes: 45
watchdog_heartbeat_path: "logs/bot_heartbeat.json"

# Dual-token order-book capture (DIAGNOSTIC ONLY — never a trading gate).
# Controls freshness/skew/quality thresholds for the per-token book store that
# records the contemporaneous YES and NO asks. Changing these never alters any
# signal, side selection, Kelly, Markov, threshold, or sizing policy.
market_data:
  # A token book older than this (seconds) is not treated as executable.
  quote_freshness_seconds: 60
  # YES/NO quote-timestamp skew beyond this (seconds) is flagged (non-blocking).
  cross_book_skew_warn_seconds: 5
  # A bid-ask spread wider than this is flagged (non-blocking).
  max_spread_warn: 0.10
  # yes_bid + no_bid above this is suspicious (books should sum to ~1).
  sum_bid_max: 1.05
  # yes_ask + no_ask below this is suspicious.
  sum_ask_min: 0.95
  # Fixed maximum risk ($ max loss) for the diagnostic paper-execution fill.
  paper_fixed_risk: 1.00

# Regime diagnostics (Phase 1) — DIAGNOSTICS ONLY, never a trading gate.
# Macro daily candles are cached locally and refreshed only on age threshold;
# they are never fetched inside the hot decision loop.
regime_diagnostics:
  enabled: true
  # Refresh BTC daily candles at most this often (seconds). 12h default.
  macro_max_age_seconds: 43200
  # Persist a combined regime snapshot at most this often (seconds). 5m default.
  snapshot_interval_seconds: 300
  snapshot_path: "logs/btc_regime_history.jsonl"
  daily_candles_cache_path: "logs/btc_daily_candles.json"
  # Preferred candle sources (NO Binance — Pi had Binance access issues).
  candle_sources: ["coingecko", "coinbase"]
  # Phase 2 (NOT implemented): crypto breadth / TradingView BPI-style index.
  breadth_enabled: false
